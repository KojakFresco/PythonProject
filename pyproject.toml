[project]
name = "pythonsem2project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.4.0",
    "fastapi>=0.135.1",
    "pyfakefs>=6.1.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
    "ruff>=0.15.6",
    "typer>=0.24.1",
    "typing>=3.10.0.0",
    "uvicorn>=0.41.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing",
    "-q",
]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = ["*/__init__.py", "*/main.py", "src/task_platform/protocols.py", "*/api_server.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
